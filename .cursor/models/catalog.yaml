# Prefer lowest cost_rank among models that meet min_capability_rank and strengths.
role_defaults:
  intake:
    max_cost_rank: 2
    min_capability_rank: 1
    prefer_strengths: [speed, mechanical]
  orchestrator:
    max_cost_rank: 4
    min_capability_rank: 3
    prefer_strengths: [planning, reasoning]
  planner:
    max_cost_rank: 4
    min_capability_rank: 3
    prefer_strengths: [planning, code]
  architect:
    max_cost_rank: 5
    min_capability_rank: 4
    prefer_strengths: [architecture, reasoning, security]
  engineer:
    max_cost_rank: 3
    min_capability_rank: 2
    prefer_strengths: [code, edit]
  executor:
    max_cost_rank: 3
    min_capability_rank: 2
    prefer_strengths: [code, edit, mechanical]
  reviewer:
    max_cost_rank: 5
    min_capability_rank: 3
    prefer_strengths: [review, reasoning, code]
    must_differ_from_role: executor

demand_overrides:
  security_auth_compliance:
    min_capability_rank: 4
    prefer_strengths: [security, reasoning]
  mechanical_single_file:
    max_cost_rank: 2
    prefer_strengths: [edit, mechanical, speed]
  cross_module_design:
    min_capability_rank: 4
    prefer_strengths: [architecture, reasoning]

escalation:
  triggers:
    - MODEL_INSUFFICIENT
    - ACCEPTANCE_FAIL_QUALITY
    - TOOL_OR_CONTEXT_LIMIT
  strategy: raise_capability_then_allow_higher_cost
  max_model_escalations_per_task: 3
  on_exhausted: escalate_human
  record_in: work/<correlation-id>/orchestrator/model_assignments.md
